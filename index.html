<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glasses Blend Test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #out { position: absolute; left: 50%; top: 50%; mix-blend-mode: screen; }
  body.picking #out { cursor: crosshair; }
  #src { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #msg { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; right: 60px; font-size: 14px; text-shadow: 0 0 4px #000; pointer-events: none; }
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: rgba(0,0,0,.82); display: flex; flex-direction: column; gap: 10px;
    max-height: 55%; overflow-y: auto; touch-action: pan-y;
  }
  #panel.hidden { display: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .row .lbl { width: 92px; }
  .sep { border-top: 1px solid #333; }
  button, label.btn, select {
    background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 8px;
    padding: 9px 12px; font-size: 14px;
  }
  button.on { background: #1d4f91; border-color: #5aa0ff; }
  input[type=file] { display: none; }
  input[type=range] { flex: 1; min-width: 110px; }
  input[type=color] { width: 44px; height: 36px; padding: 0; border: 1px solid #555; border-radius: 8px; background: none; }
